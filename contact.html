<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact | YONGHO CHOI</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Contact | YONGHO CHOI" />
    <link rel="stylesheet" href="style.css?v=yongho-9" />
  </head>
  <body data-page="contact">
    <header class="site-header">
      <div class="header-inner">
        <a href="index.html" class="site-logo">YONGHO CHOI</a>
        <nav class="site-nav" id="site-nav" aria-label="사이트">
          <a href="index.html" class="nav-link" data-nav="home">Home</a>
          <div class="nav-item">
            <button type="button" class="nav-link" data-nav="personal">Personal Works</button>
            <div class="nav-panel" id="panel-personal"></div>
          </div>
          <div class="nav-item">
            <button type="button" class="nav-link" data-nav="works">Works</button>
            <div class="nav-panel" id="panel-works"></div>
          </div>
          <a href="about.html" class="nav-link" data-nav="about">About</a>
          <a href="contact.html" class="nav-link" data-nav="contact">Contact</a>
        </nav>
      </div>
    </header>

    <main>
      <div class="page-prose" id="page-prose" data-src="contact.txt"></div>

      <section class="contact-section" aria-labelledby="contact-title">
        <h1 class="contact-title" id="contact-title" data-i18n="title">메시지 보내기</h1>
        <p class="contact-lead"><span data-i18n="leadBefore">아래 양식을 작성하면 </span><a href="mailto:choiyongho.studio@gmail.com">choiyongho.studio@gmail.com</a><span data-i18n="leadAfter">으로 바로 전송됩니다.</span></p>

        <form
          class="contact-form"
          id="contact-form"
          action="https://api.web3forms.com/submit"
          method="POST"
          data-mailto="choiyongho.studio@gmail.com"
        >
          <!-- Web3Forms 키는 받는 주소만 지정하는 공개용이라 HTML 에 노출돼도 안전 -->
          <input type="hidden" name="access_key" value="ae275a8f-15d5-4395-9dd2-a0532164cfd4" />
          <input type="hidden" name="from_name" value="YONGHO CHOI 웹사이트" />
          <input type="hidden" name="redirect" value="https://choiyonghostudio.github.io/contact.html" />
          <div class="contact-row">
            <label class="contact-field">
              <span data-i18n="name">이름</span>
              <input type="text" name="name" autocomplete="name" required maxlength="100" />
            </label>
            <label class="contact-field">
              <span data-i18n="email">이메일 (답장 받을 주소)</span>
              <input type="email" name="email" autocomplete="email" required maxlength="200" />
            </label>
          </div>
          <label class="contact-field">
            <span data-i18n="subject">제목</span>
            <input type="text" name="subject" required maxlength="200" />
          </label>
          <label class="contact-field">
            <span data-i18n="message">내용</span>
            <textarea name="message" rows="9" required maxlength="5000"></textarea>
          </label>

          <input type="checkbox" name="botcheck" class="contact-honeypot" tabindex="-1" autocomplete="off" aria-hidden="true" />

          <div class="contact-actions">
            <button type="submit" class="contact-submit" data-i18n="submit">보내기</button>
            <p class="contact-status" id="contact-status" role="status" aria-live="polite"></p>
          </div>
        </form>
      </section>
    </main>

    <footer class="site-footer">© 2026 YONGHO CHOI</footer>
    <script src="site.js?v=yongho-9"></script>
  </body>
</html>
